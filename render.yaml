databases:
  - name: scannifty100-db
    databaseName: scannifty100
    user: scannifty100
    plan: free          # upgrade to starter ($7/mo) for persistent production use

services:
  # ── Redis ───────────────────────────────────────────────────────────────────
  - type: redis
    name: scannifty100-redis
    plan: free
    ipAllowList: []     # internal-only access

  # ── Django Web (Gunicorn) ────────────────────────────────────────────────────
  - type: web
    name: scannifty100-web
    runtime: docker
    dockerfilePath: infra/docker/django.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /admin/login/
    # Runs 'python manage.py migrate' before each new version goes live
    preDeployCommand: cd apps/web && python manage.py migrate --noinput
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false           # set manually in the Render dashboard
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com  # update with your custom domain if added later
      - key: CSRF_TRUSTED_ORIGINS
        value: https://scannifty100-web.onrender.com   # update after first deploy
      - key: CORS_ALLOWED_ORIGINS
        value: https://scannifty100-web.onrender.com
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: scannifty100-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: scannifty100-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: scannifty100-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: scannifty100-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: scannifty100-db
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: scannifty100-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: scannifty100-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: scannifty100-redis
          property: connectionString
      - key: SENTRY_DSN
        sync: false           # optional — set in dashboard
      - key: ENVIRONMENT
        value: production

  # ── Celery Worker ────────────────────────────────────────────────────────────
  - type: worker
    name: scannifty100-celery-worker
    runtime: docker
    dockerfilePath: infra/docker/celery.Dockerfile
    dockerContext: .
    startCommand: celery -A config worker --loglevel=info
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: scannifty100-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: scannifty100-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: scannifty100-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: scannifty100-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: scannifty100-db
          property: port
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: scannifty100-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: scannifty100-redis
          property: connectionString

  # ── Celery Beat ──────────────────────────────────────────────────────────────
  - type: worker
    name: scannifty100-celery-beat
    runtime: docker
    dockerfilePath: infra/docker/celery.Dockerfile
    dockerContext: .
    startCommand: >-
      celery -A config beat
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --loglevel=info
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: scannifty100-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: scannifty100-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: scannifty100-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: scannifty100-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: scannifty100-db
          property: port
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: scannifty100-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: scannifty100-redis
          property: connectionString
