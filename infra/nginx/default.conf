upstream django_app {
    server web:8000;
}

# ── Option A: Plain HTTP ─────────────────────────────────────────────────────
# Use this when TLS is terminated upstream (AWS ALB, Cloudflare, etc.).
# The load balancer must forward X-Forwarded-Proto: https so Django's
# SECURE_PROXY_SSL_HEADER check is satisfied.
# If your LB does NOT set X-Forwarded-Proto, also set SECURE_SSL_REDIRECT=False
# in prod.py to avoid redirect loops.
server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

